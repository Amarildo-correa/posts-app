<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fluxo de Requisição Web — Comentaaê</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap");

            :root {
                --bg: #0d0f1a;
                --bg2: #131625;
                --bg3: #1a1d2e;
                --bg4: #1e2235;
                --border: #2a2d3e;
                --border2: #3a3d52;
                --text: #e2e4f0;
                --text2: #9ca3af;
                --text3: #6b7280;
                --purple: #818cf8;
                --purple2: #a5b4fc;
                --cyan: #06b6d4;
                --cyan2: #67e8f9;
                --green: #34d399;
                --green2: #6ee7b7;
                --amber: #f59e0b;
                --amber2: #fbbf24;
                --red: #ef4444;
                --red2: #fca5a5;
                --pink: #ec4899;
                --mono: "JetBrains Mono", monospace;
                --sans: "Inter", sans-serif;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--sans);
                min-height: 100vh;
                padding: 2rem 1rem 4rem;
            }

            /* ── HEADER ── */
            .header {
                max-width: 900px;
                margin: 0 auto 2rem;
                border-bottom: 1px solid var(--border);
                padding-bottom: 1.5rem;
            }
            .header-badge {
                display: inline-block;
                font-family: var(--mono);
                font-size: 16px;
                color: var(--cyan2);
                background: rgba(6, 182, 212, 0.1);
                border: 1px solid rgba(6, 182, 212, 0.25);
                padding: 3px 10px;
                border-radius: 20px;
                margin-bottom: 0.75rem;
                letter-spacing: 0.05em;
            }
            h1 {
                font-size: 22px;
                font-weight: 600;
                letter-spacing: -0.02em;
                margin-bottom: 0.4rem;
            }
            .header p {
                font-size: 16px;
                color: var(--text3);
                line-height: 1.6;
            }

            /* ── TABS ── */
            .page {
                max-width: 900px;
                margin: 0 auto;
            }

            .tabs {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                margin-bottom: 1.5rem;
            }
            .tab {
                padding: 7px 14px;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--text3);
                font-family: var(--mono);
                font-size: 16px;
                cursor: pointer;
                transition: all 0.2s;
                white-space: nowrap;
            }
            .tab:hover {
                background: var(--bg3);
                color: var(--text2);
            }
            .tab.on {
                background: var(--bg4);
                color: var(--purple2);
                border-color: rgba(129, 140, 248, 0.4);
            }

            /* ── SCENE ── */
            .scene {
                display: none;
                animation: fin 0.3s ease;
            }
            .scene.on {
                display: block;
            }
            @keyframes fin {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* ── SVG CONTAINER ── */
            .svg-wrap {
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: 12px;
                overflow: hidden;
                margin-bottom: 1rem;
            }
            .svg-wrap svg {
                width: 100%;
                height: auto;
                display: block;
            }

            /* ── INFO CARD ── */
            .info {
                background: var(--bg3);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 1.25rem 1.5rem;
                margin-bottom: 1rem;
            }
            .info-title {
                font-family: var(--mono);
                font-size: 16px;
                font-weight: 500;
                color: var(--purple2);
                margin-bottom: 0.6rem;
            }
            .info-body {
                font-size: 16px;
                color: var(--text2);
                line-height: 1.75;
            }
            .info-body code {
                font-family: var(--mono);
                font-size: 16px;
                color: var(--amber2);
                background: rgba(251, 191, 36, 0.08);
                padding: 1px 5px;
                border-radius: 4px;
            }

            /* ── METRICS ── */
            .metrics {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                margin-bottom: 1.5rem;
            }
            .metric {
                background: var(--bg3);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 1rem;
                text-align: center;
            }
            .metric-val {
                font-family: var(--mono);
                font-size: 18px;
                font-weight: 500;
                margin-bottom: 4px;
            }
            .metric-lbl {
                font-size: 16px;
                color: var(--text3);
            }
            .m-net {
                color: var(--cyan);
            }
            .m-proc {
                color: var(--green);
            }
            .m-total {
                color: var(--amber);
            }

            /* ── NAV BUTTONS ── */
            .nav-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 0.5rem;
            }
            .nav-row button {
                padding: 8px 18px;
                border-radius: 8px;
                border: 1px solid var(--border2);
                background: transparent;
                color: var(--text2);
                font-family: var(--mono);
                font-size: 16px;
                cursor: pointer;
                transition: all 0.2s;
            }
            .nav-row button:hover {
                background: var(--bg3);
                color: var(--text);
            }
            .nav-row button.primary {
                background: rgba(129, 140, 248, 0.12);
                color: var(--purple2);
                border-color: rgba(129, 140, 248, 0.35);
            }
            .nav-row .counter {
                font-family: var(--mono);
                font-size: 16px;
                color: var(--text3);
            }

            /* ── LEGEND ── */
            .legend {
                display: flex;
                flex-wrap: wrap;
                gap: 14px;
                margin-bottom: 1.5rem;
            }
            .leg {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 16px;
                color: var(--text3);
            }
            .leg-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                flex-shrink: 0;
            }

            /* ── ANIMATE DASH ── */
            @keyframes dash {
                to {
                    stroke-dashoffset: 0;
                }
            }
            .anim-line {
                animation: dash 1.2s linear infinite;
            }

            @media (max-width: 600px) {
                .metrics {
                    grid-template-columns: 1fr 1fr;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="header">
                <div class="header-badge">arquitetura web · Comentaaê</div>
                <h1>Fluxo completo de uma requisição web</h1>
                <p>Do clique do usuário até o HTML renderizado — latências, gargalos e onde o Redis e o MySQL entram em cena.</p>
            </div>

            <div class="legend">
                <div class="leg">
                    <div class="leg-dot" style="background: #06b6d4"></div>
                    tempo de rede (latência)
                </div>
                <div class="leg">
                    <div class="leg-dot" style="background: #34d399"></div>
                    processamento servidor
                </div>
                <div class="leg">
                    <div class="leg-dot" style="background: #f59e0b"></div>
                    tempo total / métrica
                </div>
                <div class="leg">
                    <div class="leg-dot" style="background: #ef4444"></div>
                    gargalo / atenção
                </div>
                <div class="leg">
                    <div class="leg-dot" style="background: #818cf8"></div>
                    componente Node.js
                </div>
            </div>

            <div class="tabs" id="tabs"></div>
            <div id="scenes"></div>

            <div class="nav-row">
                <button onclick="prev()" id="btn-prev">← anterior</button>
                <span class="counter" id="counter">1 / 6</span>
                <button class="primary" onclick="next()" id="btn-next">próxima etapa →</button>
            </div>
        </div>

        <script>
            const cenas = [
                /* ─── CENA 0 ─── */
                {
                    tab: "1. DNS + TCP",
                    svg: `<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="320" fill="#131625"/>

  <!-- CLIENTE -->
  <rect x="30" y="100" width="130" height="120" rx="10" fill="#1a1d2e" stroke="#2a2d3e"/>
  <rect x="44" y="114" width="102" height="64" rx="6" fill="#0d0f1a"/>
  <rect x="50" y="120" width="90" height="10" rx="3" fill="#1e3a5f"/>
  <rect x="50" y="134" width="70" height="3" rx="1" fill="#2a2d3e"/>
  <rect x="50" y="140" width="80" height="3" rx="1" fill="#2a2d3e"/>
  <rect x="50" y="146" width="60" height="3" rx="1" fill="#2a2d3e"/>
  <text x="95" y="195" text-anchor="middle" fill="#6b7280" font-size="10" font-family="JetBrains Mono">browser</text>
  <text x="95" y="210" text-anchor="middle" fill="#a5b4fc" font-size="12" font-family="JetBrains Mono" font-weight="500">Cliente</text>
  <circle cx="95" cy="100" r="6" fill="#818cf8" opacity=".7">
    <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;.2;.7" dur="2s" repeatCount="indefinite"/>

  <circle cx="340" cy="80" r="38" fill="#1a1d2e" stroke="#818cf8" stroke-width="1.5"/>

  <!-- INTERNET CLOUD -->

  <text x="490" y="215" text-anchor="middle" fill="#4b5563" font-size="9" font-family="JetBrains Mono">internet</text>
  <text x="490" y="228" text-anchor="middle" fill="#374151" font-size="8" font-family="JetBrains Mono">roteadores</text>

  <!-- SERVIDOR -->
  <rect x="630" y="80" width="140" height="180" rx="10" fill="#1a1d2e" stroke="#2a2d3e"/>
  <rect x="643" y="95" width="114" height="30" rx="6" fill="#0d0f1a" stroke="#4f46e5" stroke-width="1"/>
  <text x="700" y="115" text-anchor="middle" fill="#818cf8" font-size="10" font-family="JetBrains Mono">Node.js :3000</text>
  <rect x="643" y="133" width="114" height="30" rx="6" fill="#0d0f1a" stroke="#ef4444" stroke-width="1"/>
  <text x="700" y="153" text-anchor="middle" fill="#fca5a5" font-size="10" font-family="JetBrains Mono">MySQL :3306</text>
  <rect x="643" y="171" width="114" height="20" rx="4" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <text x="700" y="185" text-anchor="middle" fill="#4ade80" font-size="9" font-family="JetBrains Mono">Vultr · São Paulo</text>
  <text x="700" y="245" text-anchor="middle" fill="#a5b4fc" font-size="11" font-family="JetBrains Mono" font-weight="500">Servidor</text>

  <!-- SETA 1: cliente → DNS -->
  <line x1="160" y1="130" x2="302" y2="90" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="100;0" dur="1s" repeatCount="indefinite"/>
  </line>
  <polygon points="302,85 314,88 306,97" fill="#818cf8"/>
  <rect x="190" y="95" width="80" height="18" rx="4" fill="#1f1b0a" stroke="#d97706"/>
  <text x="230" y="108" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="JetBrains Mono">~5–20ms DNS</text>

  <!-- SETA 2: DNS → servidor -->
  <line x1="378" y1="80" x2="628" y2="110" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="100;0" dur="1s" repeatCount="indefinite"/>
  </line>
  <polygon points="624,106 636,109 628,119" fill="#06b6d4"/>

  <!-- TCP handshake -->
  <rect x="460" y="50" width="120" height="22" rx="5" fill="#0c1a2e" stroke="#1e3a5f"/>
  <text x="520" y="65" text-anchor="middle" fill="#67e8f9" font-size="9" font-family="JetBrains Mono">TCP 3-way handshake</text>
  <line x1="490" y1="72" x2="490" y2="192" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,3" opacity=".4"/>

  <!-- SETA 3: cliente → internet -->
  <line x1="160" y1="200" x2="430" y2="220" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="100;0" dur="1.3s" repeatCount="indefinite"/>
  </line>
  <!-- SETA 4: internet → servidor -->
  <line x1="550" y1="220" x2="628" y2="200" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="100;0" dur="1.3s" repeatCount="indefinite"/>
  </line>

  <rect x="300" y="240" width="200" height="22" rx="5" fill="#1a1d2e" stroke="#2a2d3e"/>
  <text x="400" y="255" text-anchor="middle" fill="#6b7280" font-size="9" font-family="JetBrains Mono">latência total: 20–150ms · antes do Node.js</text>
</svg>`,
                    titulo: "Etapa 1 — DNS lookup + TCP handshake",
                    corpo: `O browser não conhece o IP do servidor — ele só conhece o nome <code>comentaae.com</code>. Antes de qualquer coisa, consulta o DNS resolver para traduzir o nome em IP (<code>45.33.12.10</code>). Com o IP em mãos, estabelece a conexão TCP com 3 mensagens: SYN → SYN-ACK → ACK. Tudo isso acontece antes de uma única linha de código do Node.js executar. O Cloudflare na borda absorve o DNS e o TLS, reduzindo esse tempo drasticamente para usuários de todo o Brasil.`,
                    metricas: [
                        { val: "~5–20ms", lbl: "DNS lookup", cls: "m-net" },
                        { val: "~20ms", lbl: "TCP handshake", cls: "m-net" },
                        { val: "puro overhead", lbl: "antes do Node", cls: "m-total" },
                    ],
                },

                /* ─── CENA 1 ─── */
                {
                    tab: "2. HTTP Request",
                    svg: `<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="300" fill="#131625"/>

  <!-- BROWSER -->
  <rect x="20" y="80" width="150" height="140" rx="10" fill="#1a1d2e" stroke="#2a2d3e"/>
  <text x="95" y="105" text-anchor="middle" fill="#a5b4fc" font-size="11" font-family="JetBrains Mono" font-weight="500">Browser</text>
  <rect x="32" y="112" width="126" height="70" rx="5" fill="#0d0f1a" stroke="#4f46e5" stroke-width="1"/>
  <text x="95" y="128" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="JetBrains Mono">GET /feed HTTP/2</text>
  <text x="95" y="142" text-anchor="middle" fill="#6b7280" font-size="7" font-family="JetBrains Mono">Host: comentaae.com</text>
  <text x="95" y="154" text-anchor="middle" fill="#6b7280" font-size="7" font-family="JetBrains Mono">Cookie: session=abc123</text>
  <text x="95" y="166" text-anchor="middle" fill="#6b7280" font-size="7" font-family="JetBrains Mono">Accept: text/html</text>
  <text x="95" y="178" text-anchor="middle" fill="#6b7280" font-size="7" font-family="JetBrains Mono">Accept-Encoding: gzip</text>
  <text x="95" y="207" text-anchor="middle" fill="#6b7280" font-size="9" font-family="JetBrains Mono">monta o pacote HTTP</text>

  <!-- SETA IDA -->
  <line x1="170" y1="150" x2="490" y2="150" stroke="#4f46e5" stroke-width="2" stroke-dasharray="8,4">
    <animate attributeName="stroke-dashoffset" values="120;0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <polygon points="486,144 500,150 486,156" fill="#4f46e5"/>

  <!-- LATÊNCIA -->
  <rect x="265" y="118" width="110" height="24" rx="5" fill="#1f1b0a" stroke="#d97706"/>
  <text x="320" y="132" text-anchor="middle" fill="#fbbf24" font-size="9" font-family="JetBrains Mono">ida ~30ms</text>
  <text x="320" y="108" text-anchor="middle" fill="#6b7280" font-size="8" font-family="JetBrains Mono">latência de rede</text>

  <!-- NGINX -->
  <rect x="500" y="60" width="140" height="80" rx="8" fill="#1a1d2e" stroke="#818cf8" stroke-width="1"/>
  <text x="570" y="85" text-anchor="middle" fill="#a5b4fc" font-size="11" font-family="JetBrains Mono" font-weight="500">Nginx</text>
  <text x="570" y="100" text-anchor="middle" fill="#6b7280" font-size="9" font-family="JetBrains Mono">reverse proxy</text>
  <text x="570" y="113" text-anchor="middle" fill="#6b7280" font-size="9" font-family="JetBrains Mono">porta 443 (HTTPS)</text>
  <rect x="510" y="120" width="120" height="14" rx="4" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <text x="570" y="131" text-anchor="middle" fill="#4ade80" font-size="8" font-family="JetBrains Mono">termina TLS aqui</text>

  <!-- SETA NGINX → NODE -->
  <line x1="570" y1="140" x2="570" y2="180" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="565,176 570,190 575,176" fill="#06b6d4"/>
  <text x="590" y="165" fill="#6b7280" font-size="8" font-family="JetBrains Mono">interno</text>
  <text x="590" y="175" fill="#67e8f9" font-size="8" font-family="JetBrains Mono">~0.1ms</text>

  <!-- NODE -->
  <rect x="500" y="190" width="140" height="60" rx="8" fill="#1a1d2e" stroke="#06b6d4" stroke-width="1"/>
  <text x="570" y="215" text-anchor="middle" fill="#67e8f9" font-size="11" font-family="JetBrains Mono" font-weight="500">Node.js</text>
  <text x="570" y="230" text-anchor="middle" fill="#6b7280" font-size="9" font-family="JetBrains Mono">Express router</text>
  <text x="570" y="242" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="JetBrains Mono">porta :3000</text>

  <text x="400" y="260" text-anchor="middle" fill="#374151" font-size="9" font-family="JetBrains Mono">usuário nunca acessa o Node diretamente — Nginx é o porteiro</text>
</svg>`,
                    titulo: "Etapa 2 — HTTP Request atravessa a internet",
                    corpo: `O browser monta o pacote HTTP com método <code>GET /feed</code>, headers de autenticação (<code>Cookie: session=abc123</code>) e compressão (<code>Accept-Encoding: gzip</code>). O pacote viaja pela internet em ~30ms até chegar no Nginx. O Nginx termina o TLS (descriptografa) e repassa internamente para o <code>Node.js :3000</code> em menos de 1ms. O usuário nunca acessa o Node diretamente — o Nginx é o porteiro que protege, comprime e roteia o tráfego.`,
                    metricas: [
                        { val: "~30ms", lbl: "latência de ida", cls: "m-net" },
                        { val: "~0.1ms", lbl: "Nginx → Node", cls: "m-proc" },
                        { val: "HTTP/2", lbl: "multiplexado", cls: "m-total" },

                },

                /* ─── CENA 2 ─── */
                {
                    tab: "3. Node.js processa",
                    svg: `<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">

  <line x1="160" y1="140" x2="205" y2="140" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,3">
    <animate attributeName="stroke-dashoffset" values="50;0" dur=".8s" repeatCount="indefinite"/>

  <polygon points="201,135 212,140 201,145" fill="#818cf8"/>

                    titulo: "Etapa 6 — Fetch API (hidratação SPA) + cache invalidation",
                    corpo: `Após o HTML chegar, o <code>main.js</code> hidrata os componentes interativos. Quando o usuário curte um post, o Fetch API envia <code>POST /api/curtir</code> para o cluster API na porta <code>:3002</code>. O Node.js escreve no <code>mysql_master</code> via <code>poolEscrita</code> e invalida o cache Redis (<code>DEL feed:bairro:vm</code>) — sem o qual o feed continuaria mostrando a contagem antiga. O <code>pushState</code> reescreve a URL para <code>/fofoca-42</code> sem recarregar. O Googlebot não executa esse JavaScript — mas isso é esperado porque o HTML inicial já foi idêntico para todos.`,
                    metricas: [
                        { val: "~10–20ms", lbl: "Fetch API total", cls: "m-proc" },
                        { val: "DEL Redis", lbl: "cache invalidation", cls: "m-net" },
                        { val: "pushState", lbl: "sem reload", cls: "m-total" },
                    ],
                },
            ];

            let cur = 0;

            function buildTabs() {
                const el = document.getElementById("tabs");
                cenas.forEach((c, i) => {
                    const btn = document.createElement("button");
                    btn.className = "tab" + (i === 0 ? " on" : "");
                    btn.textContent = c.tab;
                    btn.onclick = () => go(i);
                    el.appendChild(btn);
                });
            }

            function buildScenes() {
                const el = document.getElementById("scenes");
                cenas.forEach((c, i) => {
                    const div = document.createElement("div");
                    div.className = "scene" + (i === 0 ? " on" : "");
                    div.id = "sc" + i;

                    let html = `<div class="svg-wrap">${c.svg}</div>`;
                    html += `<div class="info"><div class="info-title">${c.titulo}</div><div class="info-body">${c.corpo}</div></div>`;
                    html += `<div class="metrics">`;
                    c.metricas.forEach((m) => {
                        html += `<div class="metric"><div class="metric-val ${m.cls}">${m.val}</div><div class="metric-lbl">${m.lbl}</div></div>`;
                    });
                    html += `</div>`;
                    div.innerHTML = html;
                    el.appendChild(div);
                });
            }

            function go(i) {
                document.querySelectorAll(".scene").forEach((s, j) => s.classList.toggle("on", j === i));
                document.querySelectorAll(".tab").forEach((t, j) => t.classList.toggle("on", j === i));
                cur = i;
                document.getElementById("counter").textContent = i + 1 + " / " + cenas.length;
                document.getElementById("btn-prev").style.visibility = i === 0 ? "hidden" : "visible";
                const nb = document.getElementById("btn-next");
                nb.textContent = i === cenas.length - 1 ? "✓ completo" : "próxima etapa →";
                nb.disabled = i === cenas.length - 1;
            }

            function next() {
                if (cur < cenas.length - 1) go(cur + 1);
            }
            function prev() {
                if (cur > 0) go(cur - 1);
            }

            document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowRight") next();
                if (e.key === "ArrowLeft") prev();
            });

            buildTabs();
            buildScenes();
            go(0);
        </script>
